helmCharts:
  - repo: oci://ghcr.io/argoproj/argo-helm
    name: argo-cd
    version: "10.7.0"
    includeCRDs: true
    namespace: argocd
    releaseName: argocd
    valuesFile: values.yaml

resources:
  - appset-certificate.yaml
  - appset-ingress-route.yaml
  - certificate.yaml
  - ingress-route.yaml

generators:
  - ksops.yaml
